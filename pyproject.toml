[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coe-ing-expense-tracker"
version = "0.2.0"
description = "Applied intermediate Python course with an expense tracker"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = ["httpx>=0.28.1,<1", "pydantic>=2.14.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10", "ruff>=0.17.3,<1", "mypy>=2.4,<3"]

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
